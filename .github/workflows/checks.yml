name: Toolkit checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolkit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history for secrets
        run: bash security/scan-secrets.sh
      - name: Check dependency boundary
        run: python3 security/check_dependencies.py
  application-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test helper and package
        run: python -m unittest discover -s tests -v
